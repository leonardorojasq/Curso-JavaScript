<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora de ventas y gestión de productos">
    <title>Calculadora de Ventas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>Calculadora de ventas</h1>
            <p>Registro y administración de productos</p>
        </header>

        <section class="card">

            <h2>Agregar producto</h2>

            <form id="product-form">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="description">Descripción del producto</label>
                        <input type="text" id="description" name="description" placeholder="Nombre del producto"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="quantity">Cantidad</label>
                        <input type="number" id="quantity" name="quantity" placeholder="Cantidad" min="1" required>
                    </div>

                    <div class="form-group">
                        <label for="purchase-price">Precio de compra unitario</label>
                        <input type="number" id="purchase-price" name="purchase-price" placeholder="Precio de compra"
                            min="0" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="profit">Margen de ganancia (%)</label>
                        <input type="number" id="profit" name="profit" placeholder="Porcentaje de ganancia" min="0"
                            step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="tax">Clasificación del IVA</label>
                        <select id="tax" name="tax" required>
                            <option value="">Seleccionar IVA</option>
                            <option value="19">IVA 19%</option>
                            <option value="5">IVA 5%</option>
                            <option value="0">Exento 0%</option>
                            <option value="excluded">Excluido de IVA</option>
                        </select>
                    </div>

                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary" id="agregar-producto">
                        Agregar producto
                    </button>
                    <button type="reset" class="btn-secondary">
                        Limpiar
                    </button>
                </div>

            </form>

        </section>


        <section class="card">

            <div class="section-header">
                <h2>Productos agregados</h2>
                <span class="product-count" id="product-count">0 productos</span>

            </div>

            <div class="table-container">

                <table>
                    <thead>
                        <tr>
                            <th>Descripción</th>
                            <th>Cantidad</th>
                            <th>Precio compra</th>
                            <th>Ganancia (%)</th>
                            <th>IVA</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="product-list">
                        <tr>
                            <td colspan="6" class="empty-message">
                                No hay productos registrados.

                            </td>
                        </tr>
                    </tbody>
                </table>

            </div>

        </section>

        <footer class="footer">
            <p>Calculadora de ventas - 2026</p>
        </footer>

    </main>




    <script src="js/index.js"></script>
</body>

</html>
